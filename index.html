<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><title>Eco Job Board Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
/* ===== ECO MULTIPLIER BOARD — limewash & blueprint (committed light) =====
   Warm limewash ground, blueprint-ink structure, brass hairline, mono figures.
   Single-theme by the owner's call: light, organic, no dark mode. Every color
   is painted explicitly so the page holds on any host ground. */
:root{
  --paper:#eae8df; --paper2:#e3e1d6;
  --card:#fbfaf6; --card2:#f4f2ea;
  --ink:#1b2430; --ink2:#3c4451; --muted:#7a7768;
  --line:rgba(27,36,48,.11); --line2:rgba(27,36,48,.2);
  --blueprint:#1d4a6b; --blueprint-soft:rgba(29,74,107,.09);
  --brass:#a8813c; --brass-soft:rgba(168,129,60,.16);
  --moss:#3e7a4e; --moss-bg:#e4eee0; --moss-line:rgba(62,122,78,.3);
  --ochre:#96700f; --ochre-bg:#f4ecd6; --ochre-line:rgba(178,131,26,.34);
  --clay:#a8412f; --clay-bg:#f6e4de; --clay-line:rgba(176,74,56,.3);
  --shadow:0 1px 2px rgba(27,36,48,.05), 0 8px 22px rgba(27,36,48,.06);
  --shadow-lift:0 2px 6px rgba(27,36,48,.08), 0 18px 44px rgba(27,36,48,.12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:Archivo,"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    radial-gradient(1200px 520px at 88% -12%, rgba(168,129,60,.10), transparent 62%),
    radial-gradient(900px 460px at -8% 4%, rgba(29,74,107,.075), transparent 58%),
    repeating-linear-gradient(rgba(27,36,48,.035) 0 1px, transparent 1px 32px);
  background-attachment:fixed;
  color:var(--ink);
  font:400 15px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1200px;margin:0 auto;padding:26px 20px 130px}
h1,h2,h3{margin:0;font-family:var(--disp);text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
:focus-visible{outline:2px solid var(--blueprint);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- panel chrome: paper card, hairline, no glow ---- */
.kpi,.panel,.tablewrap,.sheet,.pal{
  background:var(--card);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
}

/* ---- header ---- */
.hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:4px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:19px;color:var(--card);
  background:var(--blueprint);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.hdr h1{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.hdr .kicker{
  display:block;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--brass);margin-bottom:2px;
}
.sync{
  margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.4px;
  border:1px solid var(--line2);background:var(--card);
}
.sync .dot{width:7px;height:7px;border-radius:50%;flex:none}
.sync.ok{color:var(--moss);border-color:var(--moss-line);background:var(--moss-bg)} .sync.ok .dot{background:var(--moss)}
.sync.warn{color:var(--ochre);border-color:var(--ochre-line);background:var(--ochre-bg)} .sync.warn .dot{background:var(--ochre)}
.sync.stale{color:var(--clay);border-color:var(--clay-line);background:var(--clay-bg)} .sync.stale .dot{background:var(--clay);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- KPI strip ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:13px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line2)}
.kpi.gx::after{background:var(--moss)} .kpi.yx::after{background:var(--ochre)} .kpi.rx::after{background:var(--clay)}
.kpi .lbl{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin-top:4px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.gx .val{color:var(--moss)} .kpi.yx .val{color:var(--ochre)} .kpi.rx .val{color:var(--clay)}
.dots{display:flex;gap:14px;margin-top:8px}
.dots span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:17px}
.dots i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---- trend sparkline ---- */
.trend{grid-column:span 2;display:flex;flex-direction:column}
.trend .spark{flex:1;margin-top:6px;min-height:46px}
.trend .sparknote{font-size:11.5px;color:var(--muted);margin-top:4px}
@media (max-width:700px){.trend{grid-column:span 1}}

/* ---- signals ---- */
.signals{
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:5px;box-shadow:var(--shadow);padding:13px 16px;margin-bottom:16px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 26px;
}
.signals .sg{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.signals .sg b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.signals .sg .hl{color:var(--clay);font-weight:600}
.signals .sgh{
  grid-column:1/-1;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--brass);margin-bottom:2px;
}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.tab{
  background:none;border:none;color:var(--muted);padding:9px 15px 11px;
  font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.2px;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blueprint);border-bottom-color:var(--blueprint)}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}

/* ---- filter bar ---- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:190px}
.search input{
  width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 32px;border-radius:5px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);
}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.fchips{display:flex;gap:5px;flex-wrap:wrap}
.fchip{
  border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:5px 12px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.3px;color:var(--muted);
}
.fchip:hover{border-color:var(--ink2);color:var(--ink)}
.fchip.on{background:var(--blueprint);border-color:var(--blueprint);color:#fff}
.fchip.on.g{background:var(--moss);border-color:var(--moss)}
.fchip.on.y{background:var(--ochre);border-color:var(--ochre)}
.fchip.on.r{background:var(--clay);border-color:var(--clay)}
.tools{display:flex;gap:6px;margin-left:auto}
.tool{
  border:1px solid var(--line2);background:var(--card);border-radius:5px;padding:6px 11px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);
}
.tool:hover{border-color:var(--blueprint);color:var(--blueprint)}
.tool kbd{font:inherit;opacity:.6;margin-left:5px}

/* ---- panels ---- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:820px){.duo{grid-template-columns:1fr}}
.panel{padding:14px 16px}
.panel h3{font-size:15px;font-weight:700;letter-spacing:-.1px;display:flex;gap:8px;align-items:baseline}
.panel h3 .note{font:400 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.2px}
.mini{width:100%;border-collapse:collapse;margin-top:6px}
.mini td{padding:7px 3px;border-top:1px solid var(--line);font-size:13.5px}
.mini tr:first-child td{border-top:none}
.mini .jn{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .rep{color:var(--muted);font-size:11.5px}
.mini .r{text-align:right}
.mini tr{cursor:pointer}
.mini tr:hover td{background:var(--card2)}

/* ---- chips + rail ---- */
.chip{
  display:inline-flex;align-items:center;font-family:var(--mono);font-weight:600;font-size:12.5px;
  border-radius:3px;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid;
}
.chip.g{background:var(--moss-bg);color:var(--moss);border-color:var(--moss-line)}
.chip.y{background:var(--ochre-bg);color:var(--ochre);border-color:var(--ochre-line)}
.chip.r{background:var(--clay-bg);color:var(--clay);border-color:var(--clay-line)}
.chip.n{background:var(--card2);color:var(--muted);border-color:var(--line2)}
.mx{display:inline-flex;align-items:center;gap:8px}
.rail{width:56px;height:6px;border-radius:2px;background:var(--paper2);position:relative;flex:none;overflow:hidden}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.rail i.g{background:var(--moss)} .rail i.y{background:var(--ochre)} .rail i.r{background:var(--clay)}
.rail::after{content:"";position:absolute;left:80%;top:-2px;bottom:-2px;width:1px;background:var(--ink2);opacity:.5}
@media (max-width:680px){.rail{display:none}}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;margin-bottom:14px}
table.jobs{width:100%;border-collapse:collapse;min-width:620px}
.jobs th{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--muted);text-align:right;padding:11px 12px;border-bottom:1px solid var(--line2);
  white-space:nowrap;background:var(--card2);
}
.jobs th.s{cursor:pointer;user-select:none}
.jobs th.s:hover{color:var(--ink)}
.jobs th .ar{color:var(--blueprint);margin-left:3px}
.jobs th:first-child,.jobs td:first-child{text-align:left;padding-left:16px}
.jobs th.mid,.jobs td.mid{text-align:center}
.jobs td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.jobs tbody tr:not(.total){cursor:pointer}
.jobs tbody tr:not(.total):hover td{background:var(--card2)}
.jobs .jn{font-weight:500}
.jobs .rep{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.jobs .profit-neg{color:var(--clay);font-weight:600}
.jobs tr.total td{
  border-top:1.5px solid var(--ink2);border-bottom:none;background:var(--card2);
  font-family:var(--disp);font-weight:700;font-size:14.5px;
}
.jobs tr.total td.num{font-family:var(--mono);font-weight:600}
.jobs td.first{position:relative}
.jobs td.first::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.jobs tr.bg td.first::before{background:var(--moss)}
.jobs tr.by td.first::before{background:var(--ochre)}
.jobs tr.br td.first::before{background:var(--clay)}
.jobs tr.bnew td.first::before{background:var(--line2)}
.rank{font-family:var(--mono);color:var(--muted);font-size:12px;width:26px;display:inline-block}
.bar{height:5px;border-radius:2px;background:var(--blueprint);opacity:.75;margin-top:4px}

.repsec{display:flex;align-items:center;gap:10px;margin:24px 2px 9px}
.repsec .avatar{width:28px;height:28px;font-size:13px}
.repsec h2{font-size:19px;font-weight:700;letter-spacing:-.3px}
.repsec .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.secnote{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--brass);margin:18px 2px 8px;
}
.act{
  border:1px solid var(--line2);background:var(--card);border-radius:4px;padding:4px 10px;
  font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);transition:all .13s;
}
.act:hover{border-color:var(--blueprint);color:var(--blueprint)}
.act.confirm{background:var(--clay);border-color:var(--clay);color:#fff}
.act.reopen:hover{border-color:var(--moss);color:var(--moss)}
.writable{display:none}
.can-write .writable{display:inline-block}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--disp);font-weight:600;font-size:14px;color:var(--card);background:var(--blueprint);
}

/* ---- empty state ---- */
.empty{padding:42px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .big{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:5px}

/* ---- job detail sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(27,36,48,.28);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);z-index:60;border-radius:0;
  border-left:1px solid var(--line2);box-shadow:var(--shadow-lift);overflow-y:auto;
  transform:translateX(103%);transition:transform .22s ease;
}
.sheet.on{transform:none}
.sheet .sh{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet .sh h3{font-size:19px;font-weight:700;letter-spacing:-.3px;padding-right:26px}
.sheet .sh .who{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.sheet .x{position:absolute;right:14px;top:14px;background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.sheet .big{padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.sheet .big .m{font-family:var(--disp);font-weight:700;font-size:40px;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.sheet .big .m.g{color:var(--moss)} .sheet .big .m.y{color:var(--ochre)} .sheet .big .m.r{color:var(--clay)} .sheet .big .m.n{color:var(--muted)}
.sheet .big .lab{font-size:13px;color:var(--ink2);line-height:1.4}
.sheet dl{margin:0;padding:6px 20px 12px}
.sheet dl .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sheet dl .row:last-child{border-bottom:none}
.sheet dl .row dt{color:var(--muted)}
.sheet dl .row dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.sheet dl .row.tot dt,.sheet dl .row.tot dd{font-weight:600;color:var(--ink)}
.sheet .gap{margin:0 20px 18px;padding:12px 14px;border-radius:5px;background:var(--card2);border:1px solid var(--line);font-size:13px;line-height:1.55;color:var(--ink2)}
.sheet .gap b{font-family:var(--mono);color:var(--ink);font-weight:600}
.sheet .gap .h{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:5px}
.sheet .foot{padding:0 20px 26px}
.splitbar{display:flex;height:9px;border-radius:2px;overflow:hidden;margin:10px 20px 0;border:1px solid var(--line)}
.splitbar i{display:block}
.splitbar .sp{background:var(--brass);opacity:.55}
.splitbar .pf{background:var(--moss)}
.splitbar .ls{background:var(--clay)}
.splitkey{display:flex;gap:14px;margin:6px 20px 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.splitkey span{display:flex;align-items:center;gap:5px}
.splitkey i{width:8px;height:8px;border-radius:2px}

/* ---- ask-claude drawer ---- */
.fab{
  position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:8px;
  background:var(--blueprint);color:#fff;border:none;border-radius:999px;padding:12px 20px;
  font-family:var(--disp);font-weight:600;font-size:14.5px;box-shadow:var(--shadow-lift);
}
.fab:hover{background:#173d59}
.fab .badge{background:var(--clay);color:#fff;border-radius:999px;font-family:var(--mono);font-size:11px;padding:1px 6px}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);z-index:65;background:var(--card);
  border-left:1px solid var(--line2);box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;
}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:17px;font-weight:700}
.drawer .dh .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.drawer .close{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.msg.q{align-self:flex-end;background:var(--blueprint);color:#fff;border-bottom-right-radius:2px}
.msg.q .who{font-family:var(--mono);font-size:10.5px;opacity:.8;margin-bottom:2px}
.msg.a{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:2px}
.msg.a .who{font-family:var(--mono);font-size:10.5px;color:var(--brass);margin-bottom:2px}
.msg .pend{font-size:11px;opacity:.8;font-style:italic;margin-top:3px}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.composer .row{display:flex;gap:8px}
.composer select,.composer textarea{
  font:inherit;font-size:13.5px;background:var(--card);color:var(--ink);
  border:1px solid var(--line2);border-radius:5px;padding:8px 10px;
}
.composer textarea{flex:1;resize:none;min-height:58px}
.composer .send{background:var(--blueprint);color:#fff;border:none;border-radius:5px;padding:9px 17px;font-family:var(--disp);font-weight:600}
.composer .hint{font-size:11px;color:var(--muted)}
.readonly-note{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}

/* ---- command palette ---- */
.palwrap{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;background:rgba(27,36,48,.3);padding-top:12vh}
.palwrap.on{display:flex}
.pal{width:min(540px,92vw);box-shadow:var(--shadow-lift);overflow:hidden}
.pal input{
  width:100%;font:inherit;font-size:16px;padding:14px 16px;border:none;border-bottom:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;
}
.pal .res{max-height:52vh;overflow-y:auto}
.pal .r{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
.pal .r:last-child{border-bottom:none}
.pal .r.sel{background:var(--blueprint-soft)}
.pal .r .k{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--brass);width:44px;flex:none}
.pal .r .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .r .rt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pal .hintbar{padding:8px 16px;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--card2);letter-spacing:.4px}

/* ---- toast ---- */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--card);border-radius:6px;padding:10px 17px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lift);
  opacity:0;pointer-events:none;transition:all .22s;z-index:80;
}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---- PIN gate (encrypted public mirror) ---- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--paper);background-image:radial-gradient(900px 420px at 50% -10%, rgba(29,74,107,.09), transparent 58%)}
#gate .box{width:min(360px,88vw);padding:32px 28px;text-align:center;background:var(--card);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow-lift)}
#gate h2{font-size:19px;font-weight:700;letter-spacing:-.2px}
#gate p{color:var(--muted);font-size:13px;margin:8px 0 18px}
#gate input{width:100%;text-align:center;font-family:var(--mono);font-weight:600;font-size:23px;letter-spacing:9px;background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:5px;padding:10px}
#gate button{margin-top:14px;width:100%;background:var(--blueprint);color:#fff;border:none;border-radius:5px;padding:11px;font-family:var(--disp);font-weight:600;font-size:15px}
#gate .err{color:var(--clay);font-size:12.5px;min-height:18px;margin-top:10px}

@media (max-width:680px){
  .jobs .hide-sm{display:none}
  #app{padding:16px 11px 120px}
  .hdr h1{font-size:20px}
  .kpi .val{font-size:26px}
  .tools{margin-left:0;width:100%}
  .tool{flex:1;text-align:center}
}

@media print{
  body{background:#fff;background-image:none}
  .fab,.drawer,.scrim,.sheet,.palwrap,.filters,.tools,#toast,.act{display:none!important}
  #app{max-width:none;padding:0}
  .kpi,.panel,.tablewrap,.signals{box-shadow:none;break-inside:avoid}
  .tablewrap{overflow:visible}
  table.jobs{min-width:0}
}

<script id="code">
"use strict";
/* ============ Eco Multiplier Board ============
   Renders entirely from the #state JSON block. Writes (close/reopen job,
   Ask-Claude requests) regenerate the whole document from state and publish
   it back via the `artifact` capability - owner/editors only. */

let STATE = JSON.parse(document.getElementById("state").textContent);
const CODE_TEXT = document.getElementById("code").textContent;
const CSS_TEXT  = document.getElementById("css").textContent;
const FONT_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com">'
  + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
  + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700'
  + '&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">';
const PEOPLE = ["Refael","Dor","Mike","Alina"];
const TARGET = 2.0, FLOOR = 1.7;
const $ = s => document.querySelector(s);
let TAB = "company", CAN_WRITE = false, ART = null, BUSY = false;
let FQ = "", FB = "all", SORT = {key:"mult", dir:1}, OPENJOB = null;

/* ---------- helpers ---------- */
const money = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const moneyK = n => Math.abs(n) >= 1e6 ? (n < 0 ? "-" : "") + "$" + (Math.abs(n)/1e6).toFixed(2) + "M"
                : Math.abs(n) >= 1e3 ? (n < 0 ? "-" : "") + "$" + Math.round(Math.abs(n)/1e3).toLocaleString() + "K" : money(n);
function mult(j){ return j.spent > 0 ? j.collected / j.spent : null; }
function bucket(j){ const m = mult(j); if (m === null) return "new";
  return m >= TARGET ? "g" : m >= FLOOR ? "y" : "r"; }
function chip(j){ const b = bucket(j);
  if (b === "new") return '<span class="chip n">NEW</span>';
  return '<span class="chip ' + b + '">' + mult(j).toFixed(2) + "&times;</span>"; }
function rail(j){ const b = bucket(j), m = mult(j);
  if (m === null) return "";
  const pct = Math.max(3, Math.min(100, (m / 2.5) * 100));
  return '<span class="rail"><i class="' + b + '" style="width:' + pct.toFixed(1) + '%"></i></span>';
}
function mx(j){ return '<span class="mx">' + rail(j) + chip(j) + "</span>"; }
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 3200); }
const sum = (list, f) => list.reduce((s,j) => s + f(j), 0);

function syncChip(){
  const ts = STATE.last_qb_sync ? Date.parse(STATE.last_qb_sync) : NaN;
  if (isNaN(ts)) return ["warn", "QuickBooks sync not connected"];
  const hrs = (Date.now() - ts) / 36e5;
  const when = new Date(ts).toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  if (hrs > 36) return ["stale", "Stale — last sync " + when];
  return ["ok", "Synced " + when];
}

/* count-up on the KPI figures (skipped for reduced-motion users) */
function countUp(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".kpi .val[data-final]").forEach(el => {
    const finalText = el.dataset.final, m = finalText.match(/^([^0-9\-]*)(-?[\d.]+)(.*)$/);
    if (!m) return;
    const target = parseFloat(m[2]), dec = (m[2].split(".")[1] || "").length;
    const t0 = performance.now(), DUR = 620;
    (function tick(t){
      const p = Math.min((t - t0) / DUR, 1), eased = 1 - Math.pow(1 - p, 3);
      el.textContent = m[1] + (target * eased).toFixed(dec) + m[3];
      if (p < 1) requestAnimationFrame(tick); else el.textContent = finalText;
    })(t0);
  });
}

/* ---------- filtering + sorting ---------- */
function passes(j){
  if (FB !== "all" && bucket(j) !== FB) return false;
  if (!FQ) return true;
  const q = FQ.toLowerCase();
  return j.job.toLowerCase().includes(q) || String(j.rep).toLowerCase().includes(q);
}
const SORTERS = {
  job:     (a,b) => a.job.localeCompare(b.job),
  mult:    (a,b) => (mult(a) ?? 99) - (mult(b) ?? 99),
  collected:(a,b) => a.collected - b.collected,
  cogs:    (a,b) => a.cogs - b.cogs,
  spent:   (a,b) => a.spent - b.spent,
  profit:  (a,b) => (a.collected - a.spent) - (b.collected - b.spent),
};
function sorted(list){
  const f = SORTERS[SORT.key] || SORTERS.mult;
  return [...list].sort((a,b) => f(a,b) * SORT.dir);
}

/* ---------- rendering ---------- */
function render(){
  const open = STATE.jobs.filter(j => j.status === "open");
  const closed = STATE.jobs.filter(j => j.status === "closed");
  const tc = sum(open, j => j.collected), tsp = sum(open, j => j.spent);
  const bx = tsp > 0 ? tc/tsp : null;
  const counts = {g:0, y:0, r:0, new:0};
  open.forEach(j => counts[bucket(j)]++);
  const [sc, stxt] = syncChip();
  const bxCls = bx === null ? "" : bx >= TARGET ? "gx" : bx >= FLOOR ? "yx" : "rx";

  let h = '<header class="hdr"><div class="brand"><div class="logo">E</div>' +
    '<div><span class="kicker">Eco Home Builders &middot; job money</span>' +
    "<h1>Multiplier Board</h1></div></div>" +
    '<div class="sync ' + sc + '"><span class="dot"></span>' + esc(stxt) + "</div></header>";

  h += '<section class="kpis">' +
    kpi("Collected", moneyK(tc), "open jobs, life-to-date") +
    kpi("Money spent", moneyK(tsp), "COGS + job expenses") +
    kpi("Profit", moneyK(tc - tsp), "collected minus spent") +
    '<div class="kpi ' + bxCls + '"><div class="lbl">Blended multiplier</div><div class="val num" data-final="' +
      (bx === null ? "—" : bx.toFixed(2) + "×") + '">' +
      (bx === null ? "—" : bx.toFixed(2) + "×") + '</div><div class="sub">target 2.00×</div></div>' +
    '<div class="kpi"><div class="lbl">Jobs by bucket</div><div class="dots">' +
      '<span><i style="background:var(--moss)"></i>' + counts.g + "</span>" +
      '<span><i style="background:var(--ochre)"></i>' + counts.y + "</span>" +
      '<span><i style="background:var(--clay)"></i>' + counts.r + "</span>" +
      (counts.new ? '<span><i style="background:var(--line2)"></i>' + counts.new + "</span>" : "") +
    '</div><div class="sub">2.00+ &middot; 1.70+ &middot; under 1.70</div></div>' +
    trendCard() + "</section>";

  h += signals(open);

  h += '<nav class="tabs" role="tablist">' +
    tabBtn("company", "Company", open.length) +
    tabBtn("reps", "Sales reps", new Set(open.map(j => j.rep)).size) +
    tabBtn("closed", "Closed", closed.length) + "</nav>";

  h += filterBar();

  if (TAB === "company") h += companyTab(open);
  else if (TAB === "reps") h += repsTab(open);
  else h += closedTab(closed);

  $("#app").innerHTML = h;
  $("#app").removeAttribute("aria-busy");
  document.body.classList.toggle("can-write", CAN_WRITE);
  wire();
  countUp();
  drawSpark();
}
function kpi(lbl, val, sub){ return '<div class="kpi"><div class="lbl">' + lbl +
  '</div><div class="val num" data-final="' + val + '">' + val + '</div><div class="sub">' + sub + "</div></div>"; }
function tabBtn(id, lbl, cnt){ return '<button class="tab' + (TAB === id ? " on" : "") +
  '" role="tab" data-tab="' + id + '">' + lbl + (cnt !== undefined ? '<span class="cnt">' + cnt + "</span>" : "") + "</button>"; }

/* ---- trend sparkline: blended multiplier per sync ---- */
function trendCard(){
  const hist = (STATE.history || []).filter(p => p && typeof p.x === "number");
  if (hist.length < 2){
    return '<div class="kpi trend"><div class="lbl">Trend</div>' +
      '<div class="sparknote" style="margin-top:8px">Tracking starts now — the line appears once two syncs are ' +
      "banked. Every sync banks one point.</div></div>";
  }
  const first = hist[0], last = hist[hist.length - 1];
  const d = last.x - first.x;
  return '<div class="kpi trend"><div class="lbl">Blended trend &middot; ' + hist.length + " syncs</div>" +
    '<canvas class="spark" id="spark" height="52"></canvas>' +
    '<div class="sparknote">' + (d >= 0 ? "Up " : "Down ") + Math.abs(d).toFixed(2) +
    "&times; since " + esc(first.d) + "</div></div>";
}
function drawSpark(){
  const cv = document.getElementById("spark");
  if (!cv) return;
  const hist = (STATE.history || []).filter(p => p && typeof p.x === "number");
  const w = cv.clientWidth || 240, hgt = 52, dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = hgt * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const xs = hist.map(p => p.x);
  const lo = Math.min(...xs, TARGET) - .06, hi = Math.max(...xs, TARGET) + .06;
  const X = i => 2 + (i / Math.max(1, hist.length - 1)) * (w - 4);
  const Y = v => hgt - 6 - ((v - lo) / (hi - lo)) * (hgt - 12);
  /* target line at 2.00 */
  g.strokeStyle = "rgba(27,36,48,.22)"; g.setLineDash([3,3]); g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, Y(TARGET)); g.lineTo(w, Y(TARGET)); g.stroke(); g.setLineDash([]);
  /* area */
  g.beginPath(); g.moveTo(X(0), Y(xs[0]));
  xs.forEach((v,i) => g.lineTo(X(i), Y(v)));
  g.lineTo(X(xs.length-1), hgt); g.lineTo(X(0), hgt); g.closePath();
  g.fillStyle = "rgba(29,74,107,.10)"; g.fill();
  /* line */
  g.beginPath(); xs.forEach((v,i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = "#1d4a6b"; g.lineWidth = 1.75; g.lineJoin = "round"; g.stroke();
  /* endpoint */
  const last = xs.length - 1, lv = xs[last];
  g.beginPath(); g.arc(X(last), Y(lv), 3.2, 0, Math.PI*2);
  g.fillStyle = lv >= TARGET ? "#3e7a4e" : lv >= FLOOR ? "#96700f" : "#a8412f"; g.fill();
  g.strokeStyle = "#fbfaf6"; g.lineWidth = 1.4; g.stroke();
}

/* ---- signals: the three things worth acting on ---- */
function signals(open){
  if (!open.length) return "";
  const priced = open.filter(j => j.spent > 0);
  const belowTarget = priced.filter(j => mult(j) < TARGET);
  const upside = sum(belowTarget, j => TARGET * j.spent - j.collected);
  const reds = priced.filter(j => mult(j) < FLOOR);
  const redGap = sum(reds, j => FLOOR * j.spent - j.collected);
  const profits = priced.map(j => j.collected - j.spent).sort((a,b) => b - a);
  const totalP = profits.reduce((s,v) => s + v, 0);
  const top3 = profits.slice(0,3).reduce((s,v) => s + v, 0);
  const share = totalP > 0 ? Math.round((top3 / totalP) * 100) : 0;

  return '<div class="signals"><div class="sgh">What the numbers are telling you</div>' +
    '<div class="sg">' + belowTarget.length + " job" + (belowTarget.length === 1 ? " is" : "s are") +
      " under 2.00&times;. Getting them all to target is <b>" + money(upside) + "</b> of billing you have not written." +
    "</div>" +
    '<div class="sg">' + (reds.length
      ? '<span class="hl">' + reds.length + " job" + (reds.length === 1 ? "" : "s") + " below 1.70&times;</span> — <b>" +
        money(redGap) + "</b> short of the floor. That is the pile to work first."
      : "Nothing is below the 1.70&times; floor right now. Rare — keep it there.") +
    "</div>" +
    '<div class="sg">Your top 3 jobs carry <b>' + share + "%</b> of all profit on the board. " +
      (share >= 50 ? "That is concentration risk — one slip moves the year." : "Spread is healthy.") +
    "</div></div>";
}

/* ---- filter bar ---- */
function filterBar(){
  const b = (id, lbl, cls) => '<button class="fchip' + (FB === id ? " on " + (cls||"") : "") +
    '" data-f="' + id + '">' + lbl + "</button>";
  return '<div class="filters">' +
    '<div class="search"><span class="ico">&#9906;</span>' +
    '<input id="q" type="search" placeholder="Filter jobs or reps…" value="' + esc(FQ) + '"></div>' +
    '<div class="fchips">' + b("all","All") + b("g","2.00+","g") + b("y","1.70+","y") +
      b("r","Under 1.70","r") + b("new","No spend") + "</div>" +
    '<div class="tools">' +
      '<button class="tool" id="tpal">Search<kbd>&#8984;K</kbd></button>' +
      '<button class="tool" id="tcsv">Copy CSV</button>' +
      '<button class="tool" id="tprint">Print</button>' +
    "</div></div>";
}

function companyTab(open){
  const withM = open.filter(j => j.spent >= 10000);
  const worst = [...withM].sort((a,b) => mult(a) - mult(b)).slice(0,5);
  const best = [...open].sort((a,b) => (b.collected - b.spent) - (a.collected - a.spent)).slice(0,5);
  const miniRow = j => { const p = j.collected - j.spent;
    return '<tr data-open="' + esc(j.id) + '"><td class="jn">' + esc(j.job) +
    '<div class="rep">' + esc(j.rep) + '</div></td><td class="mid">' + chip(j) +
    '</td><td class="r num' + (p < 0 ? " profit-neg" : "") + '">' + money(p) + "</td></tr>"; };
  let h = '<div class="duo">';
  h += '<div class="panel"><h3>Needs attention <span class="note">lowest &times;, spend over $10K</span></h3>' +
    '<table class="mini">' + worst.map(miniRow).join("") + "</table></div>";
  h += '<div class="panel"><h3>Top profit <span class="note">collected minus spent</span></h3>' +
    '<table class="mini">' + best.map(miniRow).join("") + "</table></div></div>";
  h += jobTable(open.filter(passes), "close", "COMPANY TOTAL");

}

function totalsRow(list, action, label){
  const tc = sum(list, j => j.collected), tg = sum(list, j => j.cogs), tsp = sum(list, j => j.spent);
  const p = tc - tsp;
  return '<tr class="total"><td>' + esc(label) + "</td>" +
    '<td class="mid">' + chip({collected: tc, spent: tsp}) + "</td>" +
    '<td class="num">' + money(tc) + "</td>" +
    '<td class="num hide-sm">' + money(tg) + "</td>" +
    '<td class="num">' + money(tsp) + "</td>" +
    '<td class="num' + (p < 0 ? " profit-neg" : "") + '">' + money(p) + "</td>" +
    (action === "reopen" ? '<td class="hide-sm"></td>' : "") + "<td></td></tr>";
}

function th(key, lbl, cls){
  const on = SORT.key === key;
  return '<th class="s ' + (cls||"") + '" data-sort="' + key + '">' + lbl +
    (on ? '<span class="ar">' + (SORT.dir > 0 ? "&uarr;" : "&darr;") + "</span>" : "") + "</th>";
}

function jobTable(list, action, totalLabel){
  if (!list.length) return '<div class="tablewrap"><div class="empty"><div class="big">' +
    (FQ || FB !== "all" ? "Nothing matches that filter" : "No jobs here yet") + "</div>" +
    (FQ || FB !== "all" ? "Clear the filter to see the full board."
      : "Closed jobs land here with their final numbers.") + "</div></div>";
  const rows = sorted(list);
  return '<div class="tablewrap"><table class="jobs"><thead><tr>' +
    th("job","Job / customer") + th("mult","Multiplier","mid") + th("collected","Collected") +
    th("cogs","COGS","hide-sm") + th("spent","Spent") + th("profit","Profit") +
    (action === "reopen" ? '<th class="hide-sm">Closed on</th>' : "") +
    "<th></th></tr></thead><tbody>" +
    rows.map(j => {
      const p = j.collected - j.spent, b = bucket(j);
      return '<tr class="b' + b + '" data-open="' + esc(j.id) + '">' +
      '<td class="first"><span class="jn">' + esc(j.job) + '</span><span class="rep">' + esc(j.rep) + "</span></td>" +
      '<td class="mid">' + mx(j) + "</td>" +
      '<td class="num">' + money(j.collected) + "</td>" +
      '<td class="num hide-sm">' + money(j.cogs) + "</td>" +
      '<td class="num">' + money(j.spent) + "</td>" +
      '<td class="num' + (p < 0 ? " profit-neg" : "") + '">' + money(p) + "</td>" +
      (action === "reopen" ? '<td class="hide-sm num">' + esc(j.closed_on || "") + "</td>" : "") +
      '<td><button class="act writable' + (action === "reopen" ? " reopen" : "") + '" data-act="' + action +
        '" data-id="' + esc(j.id) + '">' + (action === "reopen" ? "Reopen" : "Close job") + "</button></td></tr>";
    }).join("") + totalsRow(list, action, totalLabel || "TOTAL") + "</tbody></table></div>";
}

function repsTab(open){
  const groups = {};
  open.forEach(j => (groups[j.rep] = groups[j.rep] || []).push(j));
  const reps = Object.entries(groups).map(([rep, js]) => {
    const c = sum(js, j => j.collected), sp = sum(js, j => j.spent);
    return {rep, js, c, sp, p: c - sp, x: sp > 0 ? c/sp : null};
  }).sort((a,b) => b.p - a.p);
  const maxP = Math.max(...reps.map(r => Math.abs(r.p)), 1);

  let h = '<div class="secnote">Rep leaderboard — by total profit</div>' +
    '<div class="tablewrap"><table class="jobs"><thead><tr>' +
    "<th>Sales rep</th><th class='mid'>Blended</th><th>Collected</th>" +
    "<th>Spent</th><th>Profit</th><th class='hide-sm'>Jobs</th></tr></thead><tbody>" +
    reps.map((r, i) =>
      '<tr class="b' + bucket({collected:r.c, spent:r.sp}) + '"><td class="first">' +
      '<span class="rank">' + String(i + 1).padStart(2, "0") + '</span><span class="jn">' + esc(r.rep) + "</span>" +
      '<div class="bar" style="width:' + Math.max(4, (Math.abs(r.p)/maxP)*100).toFixed(1) + '%"></div></td>' +
      '<td class="mid">' + mx({collected:r.c, spent:r.sp}) + "</td>" +
      '<td class="num">' + money(r.c) + "</td>" +
      '<td class="num">' + money(r.sp) + "</td>" +
      '<td class="num' + (r.p < 0 ? " profit-neg" : "") + '"><b>' + money(r.p) + "</b></td>" +
      '<td class="num hide-sm">' + r.js.length + "</td></tr>").join("") +
    (function(){
      const tc = sum(open, j => j.collected), tsp = sum(open, j => j.spent);
      return '<tr class="total"><td>COMPANY TOTAL</td><td class="mid">' + chip({collected: tc, spent: tsp}) +
        '</td><td class="num">' + money(tc) + '</td><td class="num">' + money(tsp) +
        '</td><td class="num' + (tc - tsp < 0 ? " profit-neg" : "") + '"><b>' + money(tc - tsp) +
        '</b></td><td class="num hide-sm">' + open.length + "</td></tr>";
    })() +
    "</tbody></table></div>";

  const shown = reps.map(r => ({r, js: r.js.filter(passes)})).filter(x => x.js.length);
  if (!shown.length) return h + '<div class="tablewrap"><div class="empty">' +
    '<div class="big">Nothing matches that filter</div>Clear it to see every rep’s jobs.</div></div>';
  h += shown.map(({r, js}) =>
    '<div class="repsec"><div class="avatar">' + esc(r.rep[0].toUpperCase()) + "</div>" +
    "<h2>" + esc(r.rep) + '</h2><span class="meta">' + js.length + " job" + (js.length > 1 ? "s" : "") + "</span></div>" +
    jobTable(js, "close", esc(r.rep).toUpperCase() + " TOTAL")
  ).join("");
  return h;
}
function closedTab(closed){ return jobTable(closed.filter(passes), "reopen", "CLOSED TOTAL"); }

/* ---------- job detail sheet ---------- */
function sheetHTML(j){
  if (!j) return "";
  const b = bucket(j), m = mult(j), p = j.collected - j.spent;
  const other = j.spent - j.cogs;
  const marginPct = j.collected > 0 ? (p / j.collected) * 100 : 0;
  const label = b === "g" ? "At or above target" : b === "y" ? "Above the floor, under target"
    : b === "r" ? "Below the 1.70&times; floor" : "No spend booked yet";
  let gap;
  if (m === null) gap = "<b>No costs posted yet.</b> Once bills and purchases land against this customer the multiplier appears here.";
  else if (m >= TARGET) gap = "Ahead of the 2.00&times; target by <b>" + money(j.collected - TARGET * j.spent) +
    "</b> of collected revenue. Protect the margin — no free change orders.";
  else gap = "To reach 2.00&times;: collect <b>" + money(TARGET * j.spent - j.collected) +
    "</b> more (change orders, held retention, final billing) — or take <b>" +
    money(j.spent - j.collected / TARGET) + "</b> out of remaining spend.";
  const posW = j.collected > 0 ? Math.min(100, (j.spent / j.collected) * 100) : 100;

  return '<button class="x" id="shx" aria-label="Close">&times;</button>' +
    '<div class="sh"><h3>' + esc(j.job) + "</h3>" +
    '<div class="who">' + esc(j.rep) + " &middot; " + (j.status === "closed" ? "closed " + esc(j.closed_on || "") : "open job") +
      " &middot; " + esc(j.source === "live-qb" ? "live from QuickBooks" : "manual entry") + "</div></div>" +
    '<div class="big"><div class="m ' + b + '">' + (m === null ? "—" : m.toFixed(2) + "×") + "</div>" +
      '<div class="lab">' + label + "<br>" + money(j.collected) + " collected on " + money(j.spent) + " spent</div></div>" +
    '<div class="splitbar"><i class="sp" style="width:' + posW.toFixed(1) + '%"></i>' +
      '<i class="' + (p >= 0 ? "pf" : "ls") + '" style="width:' + (100 - posW).toFixed(1) + '%"></i></div>' +
    '<div class="splitkey"><span><i style="background:var(--brass);opacity:.55"></i>spent</span>' +
      '<span><i style="background:' + (p >= 0 ? "var(--moss)" : "var(--clay)") + '"></i>' +
      (p >= 0 ? "profit" : "loss") + "</span></div>" +
    "<dl>" +
      dRow("Collected", money(j.collected)) +
      dRow("Cost of goods (COGS)", money(j.cogs)) +
      dRow("Other job costs", money(other)) +
      dRow("Total spent", money(j.spent), true) +
      dRow("Profit", money(p), true) +
      dRow("Margin", marginPct.toFixed(1) + "%") +
    "</dl>" +
    '<div class="gap"><span class="h">The gap</span>' + gap + "</div>" +
    '<div class="foot"><button class="act writable' + (j.status === "closed" ? " reopen" : "") +
      '" data-act="' + (j.status === "closed" ? "reopen" : "close") + '" data-id="' + esc(j.id) + '">' +
      (j.status === "closed" ? "Reopen job" : "Close job") + "</button></div>";
}
function dRow(k, v, tot){ return '<div class="row' + (tot ? " tot" : "") + '"><dt>' + k + "</dt><dd>" + v + "</dd></div>"; }
function openSheet(id){
  OPENJOB = id;

/* ---------- command palette ---------- */
let PAL = {open:false, sel:0, items:[]};
function palItems(q){
  const out = [];
  const ql = q.trim().toLowerCase();
  const tabs = [["company","Company"],["reps","Sales reps"],["closed","Closed jobs"]];
  tabs.forEach(([id,lbl]) => { if (!ql || lbl.toLowerCase().includes(ql)) out.push({k:"View", nm:lbl, rt:"", go:() => { TAB = id; render(); }}); });
  const reps = [...new Set(STATE.jobs.map(j => j.rep))];
  reps.forEach(r => { if (!ql || String(r).toLowerCase().includes(ql))
    out.push({k:"Rep", nm:r, rt:"", go:() => { TAB = "reps"; FQ = r; render(); }}); });
  STATE.jobs.forEach(j => {
    if (ql && !j.job.toLowerCase().includes(ql) && !String(j.rep).toLowerCase().includes(ql)) return;
    const m = mult(j);
    out.push({k:"Job", nm:j.job, rt:(m === null ? "new" : m.toFixed(2) + "×"),
      go:() => { TAB = j.status === "closed" ? "closed" : "company"; FQ = ""; FB = "all"; render(); openSheet(j.id); }});
  });
  return out.slice(0, 40);
}
function palRender(){
  const res = PAL.items.map((it, i) =>
    '<div class="r' + (i === PAL.sel ? " sel" : "") + '" data-i="' + i + '">' +
    '<span class="k">' + it.k + '</span><span class="nm">' + esc(it.nm) + "</span>" +
    '<span class="rt">' + esc(it.rt) + "</span></div>").join("");
  $("#palres").innerHTML = res || '<div class="r"><span class="nm" style="color:var(--muted)">Nothing found</span></div>';
  $("#palres").querySelectorAll(".r[data-i]").forEach(el =>
    el.addEventListener("click", () => { const it = PAL.items[+el.dataset.i]; palClose(); it.go(); }));
  const sel = $("#palres .sel"); if (sel && sel.scrollIntoView) sel.scrollIntoView({block:"nearest"});
}
function palOpen(){
  PAL.open = true; $("#palwrap").classList.add("on");
  const inp = $("#palq"); inp.value = ""; PAL.sel = 0; PAL.items = palItems(""); palRender(); inp.focus();
}
function palClose(){ PAL.open = false; $("#palwrap").classList.remove("on"); }

/* ---------- CSV ---------- */
function csvOf(){
  const rows = STATE.jobs.filter(j => (TAB === "closed" ? j.status === "closed" : j.status === "open")).filter(passes);
  const head = ["Job","Rep","Status","Collected","COGS","Spent","Profit","Multiplier"];
  const line = a => a.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : v).join(",");
  const body = sorted(rows).map(j => line([j.job, j.rep, j.status, Math.round(j.collected),
    Math.round(j.cogs), Math.round(j.spent), Math.round(j.collected - j.spent),
    mult(j) === null ? "" : mult(j).toFixed(2)]));
  return [line(head), ...body].join("\n");
}
async function copyCSV(){
  const text = csvOf();
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied — paste straight into Excel or Sheets");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand("copy");
    ta.remove();
    toast(ok ? "Copied — paste straight into Excel or Sheets" : "Copy blocked by the browser — try again from a full window");
  }
}

/* ---------- self-publish ---------- */
function assemble(state){
  const json = JSON.stringify(state).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">" +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    "<title>Eco Multiplier Board</title>" + FONT_LINKS +
    "<style>" + CSS_TEXT + "</style></head><body>" +
    '<div id="app" aria-busy="true"></div><div id="toast" role="status"></div>' +
    '<script id="state" type="application/json">' + json + "<\/script>" +
    '<script id="code">' + CODE_TEXT + "<\/script></body></html>";
}
async function publishState(mutate, busyMsg){
  if (BUSY) return;
  if (!ART){ toast("Read-only view — ask Refael for edit access"); return; }
  BUSY = true; toast(busyMsg || "Saving…");
  const next = JSON.parse(JSON.stringify(STATE));
  mutate(next);
  try {
    await ART.publish(assemble(next));
    /* success: the shell reloads this view to the new version */
  } catch (e) {
    BUSY = false;
    if (e && e.code === "conflict") return;           /* reload incoming */
    if (e && (e.code === "not_writer" || e.code === "not_granted")){
      CAN_WRITE = false; render(); mountDrawer();
      toast("This view is read-only"); return;
    }
    toast("Save failed — try again (" + (e && e.code || "error") + ")");
  }
}

/* ---------- wiring ---------- */
function wireAct(b){
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    if (!b.classList.contains("confirm")){
      const orig = b.textContent;
      b.classList.add("confirm"); b.textContent = "Sure?";
      setTimeout(() => { b.classList.remove("confirm"); b.textContent = orig; }, 3500);
      return;
    }
    const id = b.dataset.id, act = b.dataset.act;
    publishState(s => {
      const j = s.jobs.find(x => x.id === id); if (!j) return;
      j.status = act === "close" ? "closed" : "open";
      if (act === "close") j.closed_on = new Date().toISOString().slice(0,10);
      else delete j.closed_on;
      (s.log = s.log || []).push({ts: new Date().toISOString(), action: act, job: j.job});
    }, act === "close" ? "Closing job…" : "Reopening…");
  });
}
function wire(){
  document.querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => { TAB = b.dataset.tab; render(); }));
  document.querySelectorAll(".act").forEach(wireAct);
  document.querySelectorAll("[data-open]").forEach(tr =>
    tr.addEventListener("click", () => openSheet(tr.dataset.open)));
  document.querySelectorAll("th.s").forEach(t => t.addEventListener("click", () => {
    const k = t.dataset.sort;
    if (SORT.key === k) SORT.dir *= -1; else { SORT.key = k; SORT.dir = (k === "job" || k === "mult") ? 1 : -1; }
    render();
  }));
  document.querySelectorAll(".fchip").forEach(c =>
    c.addEventListener("click", () => { FB = c.dataset.f; render(); }));
  const q = $("#q");
  if (q){
    q.addEventListener("input", () => {
      FQ = q.value;
      clearTimeout(wire._t);
      wire._t = setTimeout(() => { const pos = q.selectionStart; render(); const n = $("#q");
        if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }, 160);
    });
  }
  const csv = $("#tcsv"); if (csv) csv.addEventListener("click", copyCSV);
  const pr = $("#tprint"); if (pr) pr.addEventListener("click", () => window.print());
  const tp = $("#tpal"); if (tp) tp.addEventListener("click", palOpen);
}
function mountDrawer(){
  document.getElementById("drawer-root").innerHTML = drawerHTML();
  const dr = $("#drawer");
  $("#fab").addEventListener("click", () => { dr.classList.add("open"); const m = $("#msgs"); m.scrollTop = m.scrollHeight; });
  $("#dclose").addEventListener("click", () => dr.classList.remove("open"));
  const send = $("#rsend");
  if (send) send.addEventListener("click", () => {
    const text = $("#rtext").value.trim();
    if (!text) return;
    publishState(s => {
      (s.requests = s.requests || []).push({
        id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        by: $("#rby").value, text, ts: new Date().toISOString(), status: "waiting", reply: null
      });
    }, "Sending to Claude…");
  });
  const ta = $("#rtext");
  if (ta){
    try { const d = sessionStorage.getItem("eco-draft-text"); if (d) ta.value = d; } catch(e){}
    ta.addEventListener("input", () => { try { sessionStorage.setItem("eco-draft-text", ta.value); } catch(e){} });
  }
}
function mountChrome(){
  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="scrim" id="scrim"></div><aside class="sheet" id="sheet" aria-label="Job detail"></aside>' +
    '<div class="palwrap" id="palwrap"><div class="pal"><input id="palq" placeholder="Jump to a job, a rep, a view…" ' +
    'autocomplete="off" spellcheck="false"><div class="res" id="palres"></div>' +
    '<div class="hintbar">&uarr;&darr; to move &middot; Enter to open &middot; Esc to close</div></div></div>';
  document.body.appendChild(wrap);
  $("#scrim").addEventListener("click", closeSheet);
  $("#palwrap").addEventListener("click", e => { if (e.target.id === "palwrap") palClose(); });
  $("#palq").addEventListener("input", e => { PAL.items = palItems(e.target.value); PAL.sel = 0; palRender(); });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); PAL.open ? palClose() : palOpen(); return; }
    if (e.key === "Escape"){ if (PAL.open) palClose(); else if (OPENJOB) closeSheet(); return; }
    if (!PAL.open) return;
    if (e.key === "ArrowDown"){ e.preventDefault(); PAL.sel = Math.min(PAL.sel + 1, PAL.items.length - 1); palRender(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); PAL.sel = Math.max(PAL.sel - 1, 0); palRender(); }
    else if (e.key === "Enter"){ const it = PAL.items[PAL.sel]; if (it){ palClose(); it.go(); } }
  });
  window.addEventListener("resize", () => { clearTimeout(mountChrome._t); mountChrome._t = setTimeout(drawSpark, 180); });
}

/* ---------- PIN gate (encrypted public mirror) ---------- */
async function deriveKey(pin, salt){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, km,
    {name:"AES-GCM", length:256}, false, ["decrypt"]);
}
async function tryDecrypt(pin){
  if (!(window.crypto && crypto.subtle)) throw {nocrypto: true};
  const raw = Uint8Array.from(atob(STATE.encrypted), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const key = await deriveKey(pin, salt);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function pinGate(){
  const g = document.createElement("div"); g.id = "gate";
  g.innerHTML = '<div class="box"><h2>Eco Job Board</h2><p>Enter the access code Refael sent you.</p>' +
    '<input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="......">' +
    '<button id="go">Unlock</button><div class="err" id="perr"></div></div>';
  document.body.appendChild(g);
  const attempt = async () => {
    const pin = document.getElementById("pin").value.trim();
    if (!pin) return;
    try {
      const st = await tryDecrypt(pin);
      try { localStorage.setItem("eco-board-pin", pin); } catch(e){}
      STATE = st; g.remove(); boot();
    } catch (e) {
      document.getElementById("perr").textContent = (e && e.nocrypto)
        ? "This page needs a secure (https) connection to unlock"
        : "Wrong code — try again";
      try { localStorage.removeItem("eco-board-pin"); } catch(e){}
    }
  };
  document.getElementById("go").addEventListener("click", attempt);
  document.getElementById("pin").addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
  let saved = null;
  try { saved = localStorage.getItem("eco-board-pin"); } catch(e){}
  if (saved){ document.getElementById("pin").value = saved; attempt(); }
}

/* ---------- boot ---------- */
function boot(){
  render();
  mountChrome();
  if (!STATE.readonly){
    const root = document.createElement("div");
    root.id = "drawer-root";
    document.body.appendChild(root);
    mountDrawer();
    (window.claude ? claude.use("artifact") : Promise.resolve(null)).then(ns => {
      ART = ns;
      if (ns){ CAN_WRITE = true; render(); mountDrawer(); }
    }).catch(() => {});
  }
}
if (STATE.encrypted) pinGate(); else boot();
</script>
